<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Urbano">
  <!-- Los anillos concéntricos de Santa Cruz y una línea que los cruza:
       la misma identidad que pinta el header del home (HomeRouteLattice). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <rect width="96" height="96" rx="21" fill="url(#tile)"/>
  <circle cx="48" cy="48" r="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>
  <circle cx="48" cy="48" r="18" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>

  <!-- Línea de micro (ámbar) cruzando los anillos, con paradas como puntos. -->
  <path d="M6 63 L40 63 L52 40 L90 40" fill="none" stroke="#F59E0B" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="40" cy="63" r="3.4" fill="#FFFFFF"/>
  <circle cx="52" cy="40" r="3.4" fill="#FFFFFF"/>
  <circle cx="90" cy="40" r="4.2" fill="#FFFFFF"/>
</svg>
