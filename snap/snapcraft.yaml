name: urbano
version: 1.0.0
summary: Generated by Icons Launcher
description: Generated by Icons Launcher package for Linux.

confinement: strict
base: core22
grade: stable

slots:
  dbus-urbano: # adjust accordingly to your app name
    interface: dbus
    bus: session
    name: org.bar.urbano # adjust accordingly to your app name

apps:
  urbano:
    command: urbano
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
    - network
    slots:
      - dbus-urbano
parts:
  urbano:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart # The main entry-point file of the application
