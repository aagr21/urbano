name: urbano
description: "Urbano — planificador de micros urbanos de Santa Cruz de la Sierra, Bolivia."
publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.13.5

dependencies:
    flutter:
        sdk: flutter
    flutter_localizations:
        sdk: flutter

    # Estado
    flutter_riverpod: ^2.6.1

    # HTTP
    dio: ^5.7.0

    # Navegación
    go_router: ^14.6.2

    # Persistencia ligera (preferencia de tema claro/oscuro)
    shared_preferences: ^2.5.6

    # Mapa (sin API keys, tiles OSM)
    latlong2: ^0.9.1

    # GPS
    geolocator: ^13.0.2

    # Utilidades / UI
    intl: ^0.20.3
    maplibre_gl: ^0.27.1
    image_picker: ^1.2.0
    sensors_plus: ^7.1.1

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    icons_launcher: ^3.1.0
    # Solo el guard test (`test/splash_lottie_asset_test.dart`) decodifica el JSON
    # de la splash con el motor Dart. La app NO usa Lottie en runtime: en Android lo
    # reproduce la splash NATIVA (`com.airbnb.android:lottie` en `build.gradle.kts`)
    # y en iOS el launch screen es un PNG estático. Por eso vive acá, no en
    # `dependencies`: así la librería Dart de Lottie no entra en el binario.
    lottie: ^3.8.2

flutter:
    uses-material-design: true

    # Fuentes empaquetadas e inscritas como manifiesto `fonts:` (no como assets
    # crudos): Inter para cuerpo/títulos y Plus Jakarta Sans solo para el
    # wordmark. Al declararlas aquí, Flutter las incluye una sola vez como
    # fuentes y la app arranca offline, sin parpadeo y sin descargas de red.
    # `AppTypography` apunta a estas familias por `fontFamily`, sin `google_fonts`.
    fonts:
        - family: Inter
          fonts:
              - asset: assets/fonts/Inter-Regular.ttf
                weight: 400
              - asset: assets/fonts/Inter-Medium.ttf
                weight: 500
              - asset: assets/fonts/Inter-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/Inter-Bold.ttf
                weight: 700
              - asset: assets/fonts/Inter-ExtraBold.ttf
                weight: 800
        - family: PlusJakartaSans
          fonts:
              - asset: assets/fonts/PlusJakartaSans-Bold.ttf
                weight: 700
              - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
                weight: 800
