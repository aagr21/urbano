name: urbano
description: "Urbano — planificador de micros urbanos de Santa Cruz de la Sierra, Bolivia."
publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.13.5

dependencies:
    flutter:
        sdk: flutter
    flutter_localizations:
        sdk: flutter

    # Estado
    flutter_riverpod: ^2.6.1

    # HTTP
    dio: ^5.7.0

    # Navegación
    go_router: ^14.6.2

    # Persistencia ligera (preferencia de tema claro/oscuro)
    shared_preferences: ^2.5.6

    # Mapa (sin API keys, tiles OSM)
    latlong2: ^0.9.1

    # GPS
    geolocator: ^13.0.2

    # Utilidades / UI
    intl: ^0.20.3
    maplibre_gl: ^0.27.1
    image_picker: ^1.2.0
    sensors_plus: ^7.1.1
    material_ui: ^1.11.1
    cupertino_ui: ^1.1.7

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    icons_launcher: ^3.1.0

flutter:
    uses-material-design: true

    # Escudo del Gobierno Autónomo Municipal de Santa Cruz de la Sierra: la
    # banda oficial de Inicio lo pinta tal cual (PNG recortado, fondo
    # transparente). No se redibuja ni se recolorea.
    assets:
        - assets/images/

    # Montserrat (OFL, `assets/fonts/Montserrat-OFL.txt`) es la tipografía de la
    # marca Urbano: Bold para títulos, Regular para el cuerpo. Se empaqueta en
    # pesos estáticos 400..800 instanciados de la fuente variable de Google Fonts
    # e inscritos como manifiesto `fonts:` (no como assets crudos), así la app
    # arranca offline, sin parpadeo y sin `google_fonts`. La splash nativa de
    # Android la lee de `flutter_assets/assets/fonts/`.
    fonts:
        - family: Montserrat
          fonts:
              - asset: assets/fonts/Montserrat-Regular.ttf
                weight: 400
              - asset: assets/fonts/Montserrat-Medium.ttf
                weight: 500
              - asset: assets/fonts/Montserrat-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/Montserrat-Bold.ttf
                weight: 700
              - asset: assets/fonts/Montserrat-ExtraBold.ttf
                weight: 800
