name: urbano
description: "Urbano — planificador de micros urbanos de Santa Cruz de la Sierra, Bolivia."
publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.13.5

dependencies:
    flutter:
        sdk: flutter
    flutter_localizations:
        sdk: flutter

    # Estado
    flutter_riverpod: ^2.6.1

    # HTTP
    dio: ^5.7.0

    # Navegación
    go_router: ^14.6.2

    # Persistencia ligera (preferencia de tema claro/oscuro)
    shared_preferences: ^2.5.6

    # Mapa (sin API keys, tiles OSM)
    latlong2: ^0.9.1

    # GPS
    geolocator: ^13.0.2

    # Utilidades / UI
    intl: ^0.20.3
    maplibre_gl: ^0.27.1
    image_picker: ^1.2.0
    sensors_plus: ^7.1.1
    material_ui: ^1.11.1
    cupertino_ui: ^1.1.7

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    icons_launcher: ^3.1.0

flutter:
    uses-material-design: true

    # Escudo del Gobierno Autónomo Municipal de Santa Cruz de la Sierra: la
    # banda oficial de Inicio lo pinta tal cual (PNG recortado, fondo
    # transparente). No se redibuja ni se recolorea.
    assets:
        - assets/images/

    # Fuentes empaquetadas e inscritas como manifiesto `fonts:` (no como assets
    # crudos): Inter para cuerpo/labels, Outfit para los títulos destacados y
    # Fredoka para el wordmark. Al declararlas aquí, Flutter las incluye una sola vez como
    # fuentes y la app arranca offline, sin parpadeo y sin descargas de red.
    # `AppTypography` apunta a estas familias por `fontFamily`, sin `google_fonts`.
    fonts:
        - family: Inter
          fonts:
              - asset: assets/fonts/Inter-Regular.ttf
                weight: 400
              - asset: assets/fonts/Inter-Medium.ttf
                weight: 500
              - asset: assets/fonts/Inter-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/Inter-Bold.ttf
                weight: 700
              - asset: assets/fonts/Inter-ExtraBold.ttf
                weight: 800
        - family: Outfit
          fonts:
              - asset: assets/fonts/Outfit-Regular.ttf
                weight: 400
              - asset: assets/fonts/Outfit-Medium.ttf
                weight: 500
              - asset: assets/fonts/Outfit-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/Outfit-Bold.ttf
                weight: 700
              - asset: assets/fonts/Outfit-ExtraBold.ttf
                weight: 800
        # Fredoka (OFL) SOLO para el wordmark «Urbano»: terminaciones
        # redondeadas, amables, que riman con la parada del logotipo.
        - family: Fredoka
          fonts:
              - asset: assets/fonts/Fredoka-Bold.ttf
                weight: 700
