<?xml version="1.0" encoding="UTF-8"?>
<!--
  FRAME 0 de la pantalla de carga, para el launch screen de iOS (Apple lo exige
  estático). Es una reducción del primer fotograma que pinta `SplashGate`
  (diseño «Pantalla de carga Urbano Santa Cruz») sobre un lienzo de 360x360,
  para que el paso storyboard -> portada de Dart no se lea como un corte:

   * escudo del municipio con texto blanco (`assets/images/gobierno-santa-cruz-blanco.png`),
   * logo blanco de Urbano (`assets/images/urbano-logo-blanco.png`) y su lema
     en Montserrat Bold,
   * el girófono: pista verde clara y arco naranja #FD7502 de 216 grados desde
     las 3 en punto,
   * «Cargando» (Montserrat ExtraBold) y la etapa «Preparando la app»,
   * la barra: pista blanca al 88 % con el 10 % relleno de naranja.

  El fondo (verde de marca) lo pone el storyboard. Si cambia la pose, regenerar
  el PNG: tools/make-ios-splash-frame0.sh
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 360 360" width="360" height="360">
  <image x="125" y="4" width="110" height="45" xlink:href="../images/gobierno-santa-cruz-blanco.png"/>
  <image x="74" y="66" width="212" height="53" xlink:href="../images/urbano-logo-blanco.png"/>
  <text x="180" y="138" text-anchor="middle" font-family="Montserrat" font-weight="700" font-size="17" fill="#FFFFFF">Muévete por Santa Cruz</text>
  <!-- girófono -->
  <circle cx="180" cy="186" r="21" fill="none" stroke="#B9EFC9" stroke-opacity="0.75" stroke-width="6"/>
  <path d="M201 186 A 21 21 0 1 1 163.0 173.7" fill="none" stroke="#FD7502" stroke-width="6" stroke-linecap="round"/>
  <!-- texto de carga -->
  <text x="180" y="248" text-anchor="middle" font-family="Montserrat" font-weight="800" font-size="21" fill="#FFFFFF">Cargando</text>
  <text x="180" y="272" text-anchor="middle" font-family="Montserrat" font-weight="500" font-size="14" fill="#FFFFFF">Preparando la app</text>
  <!-- barra -->
  <rect x="90" y="292" width="180" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.88"/>
  <rect x="90" y="292" width="18" height="8" rx="4" fill="#FD7502"/>
</svg>
