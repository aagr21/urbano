<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <clipPath id="plate"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#008C7B" filter="url(#drop)"/>
  <g clip-path="url(#plate)">
    <g transform="translate(100 100) scale(0.8046875)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2AD8C3"/>
      <stop offset=".58" stop-color="#008C7B"/>
      <stop offset="1" stop-color="#00584F"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".2" r=".65">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <circle cx="-40" cy="1090" r="360" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="12"/><circle cx="-40" cy="1090" r="540" fill="none" stroke="#fff" stroke-opacity="0.11" stroke-width="10"/><circle cx="-40" cy="1090" r="730" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="10"/><circle cx="-40" cy="1090" r="930" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="8"/>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#004A42" flood-opacity=".45"/>
    </filter>
    <linearGradient id="route" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#E3FFFA"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A55"/>
      <stop offset="1" stop-color="#FF5B35"/>
    </linearGradient>
  </defs>
  <g transform="translate(512 512) scale(0.94) translate(-538.5 -501.3)">
    <path d="M330 330 L330 560 A182.0 182.0 0 0 0 694 560 L694 520" fill="none" stroke="url(#route)" stroke-width="124"
          stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
    <!-- Eje del recorrido: paradas punteadas, como en los mapas de la app. -->
    <path d="M330 330 L330 560 A182.0 182.0 0 0 0 694 560 L694 520" fill="none" stroke="#008C7B" stroke-opacity=".5"
          stroke-width="18" stroke-linecap="round" stroke-dasharray="0 52"/>
    <!-- Donde se sube: la parada, un anillo hueco como en un diagrama de metro. -->
    <circle cx="330" cy="330" r="30" fill="none" stroke="#008C7B" stroke-width="20"/>
    <!-- A dónde vas: el pin coral, con borde blanco para despegarlo del fondo. -->
    <path d="M694 480 C662.8 433.20000000000005 590 376.0 590 313.6 A104 104 0 1 1 798 313.6 C798 376.0 725.2 433.20000000000005 694 480 Z" fill="url(#pin)" stroke="#fff" stroke-width="22"
          stroke-linejoin="round" filter="url(#shadow)"/>
    <circle cx="694" cy="313.6" r="41.6" fill="#fff"/>
  </g></g>
  </g>
</svg>
