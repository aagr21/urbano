<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35F04F"/>
      <stop offset=".55" stop-color="#06BD4A"/>
      <stop offset="1" stop-color="#018A3C"/>
    </linearGradient>
    <radialGradient id="glow" cx=".2" cy=".15" r=".6">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#014D23" flood-opacity=".35"/>
    </filter>
  </defs>
  <g transform="translate(512 512) scale(0.94) translate(-516.0 -501.0)">
    <!-- El recorrido: la U blanca, de la parada al destino. -->
    <path d="M342 330 L342 560 A170.0 170.0 0 0 0 682 560 L682 470" fill="none" stroke="#fff" stroke-width="104" filter="url(#shadow)"/>
    <!-- La parada de salida: aro blanco, centro verde y punto blanco. -->
    <circle cx="342" cy="330" r="92" fill="#fff" filter="url(#shadow)"/>
    <circle cx="342" cy="330" r="62" fill="#06BD4A"/>
    <circle cx="342" cy="330" r="34" fill="#fff"/>
    <!-- A dónde vas: el pin naranja, con la punta sobre la pata derecha. -->
    <path d="M682 480 C652.0 435.0 582 380.0 582 320.0 A100 100 0 1 1 782 320.0 C782 380.0 712.0 435.0 682 480 Z" fill="#FD7502" filter="url(#shadow)"/>
    <circle cx="682" cy="320.0" r="42.0" fill="#fff"/>
  </g>
</svg>
