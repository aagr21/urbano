<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#029E46" flood-opacity=".35"/>
    </filter>
  </defs>
  <g transform="translate(512 512) scale(0.72) translate(-516.0 -501.0)">
