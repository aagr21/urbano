<?xml version="1.0" encoding="UTF-8"?>
<!--
  POSE DEL FRAME 0 de `splash.json`, dibujada a mano sobre el mismo lienzo
  (360x360). Sirve SOLO para el launch screen de iOS, que Apple exige estático:
  la imagen es lo que el Lottie muestra en su primer fotograma, para que el paso
  storyboard -> portada no se lea como un corte.

  NO es un export del JSON (no hay headless renderer en el repo): es una
  traducción geométrica capa a capa del frame 0 de la PANTALLA DE CARGA. De ahí
  los números (centro del dial en (180,160), igual que en el JSON):

   * `anillos`: cuatro circunferencias blancas (α 0,14..0,08, grosor 2) centradas
     en (34,352), radii 78/140/204/268: los anillos de Santa Cruz asomando por la
     esquina inferior izquierda.
   * `pista`: círculo completo 104/9 blanco α0,18 en (180,160): la pista del dial.
   * `aro-coral`: arco de 207 grados (recorte s:0 e:57.5) desde las 3 en punto
     (232,160) hasta (133.7,136.4), coral #FF5B35, grosor 9, redondeado.
   * `aro-aqua`: los siguientes 58 grados (recorte s:57.5 e:73.5) hasta
     (175.5,108.2), aqua #2AD8C3 a α0,6.
   * `Cargando`: texto blanco a (180,250), Inter SemiBold 24, centrado.
   * `barra`: pista 132x5 α0,2 + relleno coral 74x5, centrados en y=292.

  En t=0 la rotación del JSON es 0, así que el aro se dibuja tal cual: la cabeza
  mira a la derecha. Si el JSON cambia de pose o de geometría, regenerar el PNG:
    tools/make-ios-splash-frame0.sh
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <!-- anillos de la ciudad (esquina inferior izquierda) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2">
    <circle cx="34" cy="352" r="78" stroke-opacity="0.14"/>
    <circle cx="34" cy="352" r="140" stroke-opacity="0.12"/>
    <circle cx="34" cy="352" r="204" stroke-opacity="0.10"/>
    <circle cx="34" cy="352" r="268" stroke-opacity="0.08"/>
  </g>
  <!-- barra de progreso -->
  <rect x="114" y="289.5" width="132" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.2"/>
  <rect x="114" y="289.5" width="74" height="5" rx="2.5" fill="#FF5B35"/>
  <!-- pista del dial -->
  <circle cx="180" cy="160" r="52" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="9"/>
  <!-- estela aqua -->
  <path d="M133.7 136.4 A 52 52 0 0 1 175.5 108.2" fill="none" stroke="#2AD8C3" stroke-opacity="0.6" stroke-width="9" stroke-linecap="round"/>
  <!-- cabeza coral -->
  <path d="M232 160 A 52 52 0 1 1 133.7 136.4" fill="none" stroke="#FF5B35" stroke-width="9" stroke-linecap="round"/>
  <!-- etiqueta de carga -->
  <text x="180" y="250" text-anchor="middle" font-family="Inter" font-weight="600" font-size="24" letter-spacing="1.2" fill="#FFFFFF">Cargando</text>
</svg>
