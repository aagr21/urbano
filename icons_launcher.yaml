# Ícono de la app. NO edites los PNG a mano: el diseño vive en
# tools/app_icon.py y todo se regenera con tools/make-app-icon.sh.
icons_launcher:
  image_path: "assets/brand/app-icon/icon-full.png"
  platforms:
    android:
      enable: true
      # Legacy (API < 26): placa redondeada con esquinas transparentes.
      image_path: "assets/brand/app-icon/icon-rounded.png"
      adaptive_background_image: "assets/brand/app-icon/icon-background.png"
      adaptive_foreground_image: "assets/brand/app-icon/icon-foreground.png"
      # Íconos temáticos de Android 13+.
      adaptive_monochrome_image: "assets/brand/app-icon/icon-monochrome.png"
    ios:
      enable: true
      # Opaco y a sangre: iOS recorta solo y rechaza transparencias.
      image_path: "assets/brand/app-icon/icon-full.png"
      dark_path: "assets/brand/app-icon/icon-dark.png"
    macos:
      enable: true
      image_path: "assets/brand/app-icon/icon-macos.png"
    web:
      enable: true
      image_path: "assets/brand/app-icon/icon-rounded.png"
      favicon_path: "assets/brand/app-icon/icon-rounded.png"
    windows:
      enable: true
      image_path: "assets/brand/app-icon/icon-rounded.png"
    linux:
      enable: true
      image_path: "assets/brand/app-icon/icon-rounded.png"
